<style>
:root{
  --red:#CC0000;
  --red-dark:#990000;
  --red-glow:rgba(204,0,0,0.35);
  --black:#0A0A0A;
  --gray-dark:#141414;
  --gray-mid:#1E1E1E;
  --gray-border:#2A2A2A;
  --white:#F5F5F5;
  --silver:#B0B0B0;
  --ice:#D0E8F5;
  --ice-dim:#8cb8d4;
  --green:#00cc44;
}

*{margin:0;padding:0;box-sizing:border-box;}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--black);
  color:var(--white);
  font-family:'Barlow',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

#loader{
  position:fixed;
  inset:0;
  z-index:9999;
  background:var(--black);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:24px;
  transition:opacity 0.5s ease;
}

#loader.hidden{
  opacity:0;
  pointer-events:none;
}

#loader.gone{
  display:none;
}

.loader-glow{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:400px;
  height:400px;
  background:radial-gradient(circle,rgba(204,0,0,0.18) 0%,transparent 65%);
  animation:glow-pulse 2.4s ease-in-out infinite;
  pointer-events:none;
}

@keyframes glow-pulse{
  0%,100%{opacity:0.5;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
}

.loader-ring-wrap{
  position:relative;
  width:120px;
  height:120px;
  z-index:2;
}

.loader-ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:3px solid rgba(204,0,0,0.15);
  border-top-color:var(--red);
  animation:spin 1s linear infinite;
}

.loader-ring2{
  position:absolute;
  inset:10px;
  border-radius:50%;
  border:2px solid rgba(204,0,0,0.08);
  border-bottom-color:rgba(204,0,0,0.5);
  animation:spin 1.6s linear infinite reverse;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.loader-logo-wrap{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.loader-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.7rem;
  letter-spacing:4px;
  text-transform:uppercase;
  color:var(--silver);
  position:relative;
  z-index:2;
}

header{
  position:relative;
  background:var(--black);
  border-bottom:3px solid var(--red);
  overflow:hidden;
}

.hbg{
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 60px,
      rgba(204,0,0,0.04) 60px,
      rgba(204,0,0,0.04) 61px
    ),
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 60px,
      rgba(204,0,0,0.04) 60px,
      rgba(204,0,0,0.04) 61px
    );
}

.hglow{
  position:absolute;
  top:-80px;
  left:50%;
  transform:translateX(-50%);
  width:700px;
  height:300px;
  background:radial-gradient(ellipse,rgba(204,0,0,0.2) 0%,transparent 70%);
  pointer-events:none;
}

.header-inner{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  padding:26px 40px 22px;
  gap:20px;
}

.logo-block{
  display:flex;
  align-items:center;
  gap:16px;
}

.site-title h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:3rem;
  letter-spacing:2px;
  color:var(--white);
  text-shadow:0 0 30px var(--red-glow);
  line-height:1;
}

.site-title h1 span{
  color:var(--red);
}

.site-title p{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.78rem;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--silver);
  margin-top:3px;
}

.main{
  padding:26px 40px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:16px;
  max-width:1400px;
  margin:0 auto;
}

.card{
  background:var(--gray-mid);
  border:1px solid var(--gray-border);
  border-radius:4px;
  overflow:hidden;
  animation:fadein 0.5s ease both;
}

@keyframes fadein{
  from{
    opacity:0;
    transform:translateY(12px)
  }
  to{
    opacity:1;
    transform:translateY(0)
  }
}

.card-header{
  padding:12px 18px 9px;
  border-bottom:1px solid var(--gray-border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.card-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.67rem;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--red);
}

.card-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.2rem;
  letter-spacing:2px;
}

.card-body{
  padding:13px 18px;
}

.api-error{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.8rem;
  color:var(--silver);
  padding:8px 0;
  letter-spacing:1px;
}

.ctoggle{
  cursor:pointer;
  user-select:none;
}

.cchev{
  font-size:0.7rem;
  color:var(--silver);
  transition:transform 0.3s ease;
  margin-left:8px;
  display:inline-block;
}

.cchev.open{
  transform:rotate(180deg);
}

.ccol{
  overflow:hidden;
  max-height:0;
  transition:max-height 0.45s cubic-bezier(0.4,0,0.2,1);
}

.ccol.open{
  max-height:3000px;
}

.hdr-preview{
  text-align:right;
  flex-shrink:0;
}

.hdr-preview-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.6rem;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--silver);
}

.hdr-preview-val{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.1rem;
  letter-spacing:2px;
  color:var(--white);
}

.hdr-preview-sub{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.78rem;
  font-weight:600;
  color:var(--white);
}

<script>
/* ===== FIX PAGE OPENING IN MIDDLE ===== */

if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}

window.addEventListener('beforeunload', () => {
  window.scrollTo(0,0);
});

function forceTop(){
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
  window.scrollTo({
    top:0,
    left:0,
    behavior:'instant'
  });
}

/* ===== ORIGINAL CONSTANTS ===== */

const CAR='CAR',
SEASON='20252026',
TZ='America/Chicago';

const EAST_TEAMS=['CAR','BUF','TB','TBL','MTL','BOS','OTT','PHI','PIT'];

const WEST_TEAMS=['COL','DAL','VGK','ANA','MIN','EDM','UTA','LAK'];

const SEED_MAP={
  CAR:1,
  PHI:8,
  BUF:2,
  MTL:4,
  OTT:6,
  BOS:5,
  PIT:7,
  TB:3,
  TBL:3,
  TBJ:3,
  COL:1,
  MIN:3,
  DAL:2,
  VGK:4,
  ANA:7,
  EDM:5,
  UTA:6,
  LAK:8
};

const API={
  standings:`https://api-web.nhle.com/v1/standings/now`,
  schedule:t=>`https://api-web.nhle.com/v1/club-schedule-season/${t}/${SEASON}`,
  scoreboard:`https://api-web.nhle.com/v1/score/now`,
  boxscore:id=>`https://api-web.nhle.com/v1/gamecenter/${id}/boxscore`,
  espn:`https://site.api.espn.com/apis/v2/sports/hockey/nhl/playoffs`,
  skatersLeaders:cat=>`https://api-web.nhle.com/v1/skater-stats-leaders/${SEASON}/3?categories=${cat}&limit=10`,
  skatersGP:`https://api-web.nhle.com/v1/skater-stats-leaders/${SEASON}/3?categories=gamesPlayed&limit=50`,
  goalieLeaders:`https://api-web.nhle.com/v1/goalie-stats-leaders/${SEASON}/3?categories=savePctg&limit=10`,
  goalieGP:`https://api-web.nhle.com/v1/goalie-stats-leaders/${SEASON}/3?categories=gamesPlayed&limit=50`,
};

const PROXIES=[
  u=>`https://corsproxy.io/?url=${encodeURIComponent(u)}&_cb=${Date.now()}`,
  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
];

const $=id=>document.getElementById(id);

function mkSignal(ms){
  try{
    return AbortSignal.timeout(ms);
  }catch(e){
    const c=new AbortController();
    setTimeout(()=>c.abort(),ms);
    return c.signal;
  }
}

async function fj(url){
  for(const p of PROXIES){
    try{
      const r=await fetch(
        p(url),
        {
          signal:mkSignal(8000),
          cache:'no-store'
        }
      );

      if(r.ok){
        return r.json();
      }

    }catch(e){
      continue;
    }
  }

  throw new Error('proxies failed');
}

async function fjD(url){
  try{
    const r=await fetch(
      url,
      {
        signal:mkSignal(5000),
        cache:'no-store'
      }
    );

    if(r.ok){
      return r.json();
    }

  }catch(e){}

  return fj(url);
}

/* ===== PLAYOFF LEADERS FIX ===== */

function getPlayerKey(p){
  return p.playerId ??
         p.skaterId ??
         p.goalieId ??
         p.id ??
         p.entityId ??
         null;
}

function leaderList(data,cat){
  return data?.[cat] ||
         data?.data ||
         data?.leaders ||
         data?.stats ||
         [];
}

function pName(p){
  const first=p.firstName?.default || p.firstName || '';
  const last=p.lastName?.default || p.lastName || '';

  if(first && last){
    return `${first[0]}. ${last}`;
  }

  return p.name?.default ||
         p.fullName?.default ||
         p.fullName ||
         p.name ||
         '—';
}

function pTeam(p){
  const t=
    p.teamAbbrev?.default ||
    p.teamAbbrev ||
    p.teamAbbrevs ||
    p.teamCommonName?.default ||
    '—';

  return String(t);
}

function pIsCar(p){
  return pTeam(p)===CAR || pTeam(p).includes(CAR);
}

function buildGPMap(data){
  const map={};

  const list=leaderList(data,'gamesPlayed');

  list.forEach(p=>{

    const key=getPlayerKey(p);

    const gp=
      p.value ??
      p.gamesPlayed ??
      p.gp ??
      p.stats?.gamesPlayed ??
      0;

    if(key!=null){
      map[key]=gp;
    }

    map[`${pName(p)}|${pTeam(p)}`]=gp;
  });

  return map;
}

function getGP(p,gpMap){

  const direct=
    p.gamesPlayed ??
    p.gp ??
    p.stats?.gamesPlayed;

  if(direct!=null){
    return direct;
  }

  const key=getPlayerKey(p);

  if(key!=null && gpMap?.[key]!=null){
    return gpMap[key];
  }

  const nameKey=`${pName(p)}|${pTeam(p)}`;

  if(gpMap?.[nameKey]!=null){
    return gpMap[nameKey];
  }

  return '—';
}

function skaterRows(list,label,gpMap){

  if(!list?.length){
    return '<p class="ps-msg">No data available yet</p>';
  }

  const hdr=`
    <div class="ps-col-hdr">
      <div style="width:18px"></div>
      <div style="flex:1">Player</div>
      <div style="width:32px;text-align:right">Team</div>
      <div style="width:32px;text-align:right">${label}</div>
      <div style="width:24px;text-align:right">GP</div>
    </div>
  `;

  return hdr + list.slice(0,8).map((p,i)=>{

    const car=pIsCar(p);

    const val=p.value ?? '—';

    const gp=getGP(p,gpMap);

    return `
      <div class="ps-row ${car?'ps-car':''}">
        <div class="ps-rank">${i+1}</div>

        <div class="ps-name ${car?'car-name':''}">
          ${pName(p)}
        </div>

        <div class="ps-team ${car?'car-team':''}">
          ${pTeam(p)}
        </div>

        <div class="ps-val ${i===0?'lead':''}">
          ${val}
        </div>

        <div class="ps-gp">
          ${gp}
        </div>
      </div>
    `;
  }).join('');
}

function goalieRows(list,gpMap){

  if(!list?.length){
    return '<p class="ps-msg">No data available yet</p>';
  }

  const hdr=`
    <div class="ps-col-hdr">
      <div style="width:18px"></div>
      <div style="flex:1">Goalie</div>
      <div style="width:32px;text-align:right">Team</div>
      <div style="width:36px;text-align:right">SV%</div>
      <div style="width:24px;text-align:right">GP</div>
    </div>
  `;

  return hdr + list.slice(0,8).map((g,i)=>{

    const car=pIsCar(g);

    const sv=
      g.value!=null
        ? parseFloat(g.value).toFixed(3)
        : '—';

    const gp=getGP(g,gpMap);

    return `
      <div class="ps-row ${car?'ps-car':''}">
        <div class="ps-rank">${i+1}</div>

        <div class="ps-name ${car?'car-name':''}">
          ${pName(g)}
        </div>

        <div class="ps-team ${car?'car-team':''}">
          ${pTeam(g)}
        </div>

        <div class="ps-val ${i===0?'lead':''}"
          style="width:36px;font-size:0.88rem;">
          ${sv}
        </div>

        <div class="ps-gp">
          ${gp}
        </div>
      </div>
    `;
  }).join('');
}

let leadersLoaded=false;

async function loadLeaders(){

  if(leadersLoaded)return;

  leadersLoaded=true;

  try{

    const[
      pts,
      gls,
      ast,
      gtg,
      skaterGP,
      goalieGP
    ] = await Promise.all([
      fjD(API.skatersLeaders('points')).catch(()=>null),
      fjD(API.skatersLeaders('goals')).catch(()=>null),
      fjD(API.skatersLeaders('assists')).catch(()=>null),
      fjD(API.goalieLeaders).catch(()=>null),
      fjD(API.skatersGP).catch(()=>null),
      fjD(API.goalieGP).catch(()=>null),
    ]);

    const sGPMap=buildGPMap(skaterGP);

    const gGPMap=buildGPMap(goalieGP);

    $('ps-pts').innerHTML=
      pts
      ? skaterRows(
          leaderList(pts,'points'),
          'PTS',
          sGPMap
        )
      : '<p class="ps-msg">Unavailable</p>';

    $('ps-gls').innerHTML=
      gls
      ? skaterRows(
          leaderList(gls,'goals'),
          'G',
          sGPMap
        )
      : '<p class="ps-msg">Unavailable</p>';

    $('ps-ast').innerHTML=
      ast
      ? skaterRows(
          leaderList(ast,'assists'),
          'A',
          sGPMap
        )
      : '<p class="ps-msg">Unavailable</p>';

    $('ps-gtg').innerHTML=
      gtg
      ? goalieRows(
          leaderList(gtg,'savePctg'),
          gGPMap
        )
      : '<p class="ps-msg">Unavailable</p>';

  }catch(e){

    console.error('Leaders error',e);

    ['pts','gls','ast','gtg'].forEach(t=>{
      $('ps-'+t).innerHTML=
        '<p class="ps-msg">Stats unavailable</p>';
    });
  }
}

</script>
